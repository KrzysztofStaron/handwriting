<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Handwriting RL</title>
<style>
  :root {
    color-scheme: light;
    --ink: #1c1915;
    --muted: #5e584f;
    --line: #e3ddd2;
    --paper: #f7f4ee;
    --card: #fffdf9;
    --green: #1f4b3a;
    --rust: #9a4318;
    --live: #1d6b45;
    --idle: #8a5a12;
    --stop: #6b6560;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font: 15px/1.45 ui-sans-serif, system-ui, sans-serif;
  }
  header, main { width: min(1120px, calc(100% - 32px)); margin: 0 auto; }
  header {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    align-items: flex-end;
    padding: 22px 0 8px;
  }
  h1 { font-size: 22px; font-weight: 650; margin: 0; letter-spacing: -0.02em; }
  header a { color: var(--ink); font-weight: 650; }
  h2 { font-size: 15px; margin: 0 0 8px; }
  .sample-prompt {
    display: flex;
    align-items: baseline;
    gap: 12px;
    margin: 16px 0 6px;
    font-weight: 650;
    color: var(--ink);
  }
  .sample-prompt .len {
    margin-left: auto;
    flex: none;
    font-size: 12px;
    font-weight: 650;
    font-variant-numeric: tabular-nums;
    color: var(--muted);
  }
  .sub, .note, .quiet { color: var(--muted); }
  .sub { margin: 4px 0 0; min-height: 1.2em; }
  .note {
    margin: 8px 0 0;
    padding: 8px 10px;
    background: #f3ead7;
    border-radius: 8px;
  }
  .line-list { display: flex; flex-direction: column; gap: 8px; }
  .line {
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px;
    background: #fff;
  }
  .line.on { border-color: var(--green); }
  .line-head, .session-head {
    display: flex;
    gap: 10px;
    align-items: baseline;
    width: 100%;
    background: none;
    border: 0;
    padding: 0;
    text-align: left;
    cursor: pointer;
    font: inherit;
    color: inherit;
  }
  .line-name { font-weight: 650; }
  .line-meta, .auto {
    color: var(--muted);
    font-size: 13px;
  }
  .line-meta { margin-left: auto; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .line-form, .session-form {
    display: grid;
    gap: 6px;
    margin-top: 8px;
  }
  .line-form input, .line-form textarea,
  .session-form input, .session-form textarea {
    font: inherit;
    width: 100%;
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 6px 8px;
    background: var(--card);
    color: var(--ink);
  }
  .session {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid var(--line);
  }
  .session.on .session-head .line-name { color: var(--green); }
  .field-label { font-size: 12px; font-weight: 650; color: var(--muted); }
  .controls { display: flex; gap: 8px; align-items: center; }
  select {
    font: inherit;
    padding: 6px 8px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: var(--card);
    color: var(--ink);
  }
  .pill {
    font-size: 13px;
    font-weight: 650;
    padding: 4px 10px;
    border-radius: 999px;
    background: #ece8e1;
    color: var(--stop);
  }
  .pill.live { background: #e5f4eb; color: var(--live); }
  .pill.idle { background: #f8efd8; color: var(--idle); }
  .error { color: #8d1d1d; min-height: 1.2em; margin: 6px 0 0; }
  .views {
    display: flex;
    gap: 6px;
    align-items: center;
    margin: 14px 0 0;
  }
  .views span {
    margin-right: 4px;
    font-size: 13px;
    font-weight: 650;
    color: var(--muted);
  }
  .views button.on {
    background: var(--green);
    color: #fff;
    border-color: var(--green);
  }
  .charts {
    margin-top: 10px;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 10px;
  }
  figure {
    margin: 0;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 8px 10px 10px;
  }
  figcaption {
    display: flex;
    align-items: baseline;
    gap: 8px;
    margin: 0 0 6px;
    font-size: 13px;
    font-weight: 650;
    color: var(--ink);
  }
  figcaption .until { font-variant-numeric: tabular-nums; }
  .badge {
    margin-left: auto;
    flex: none;
    font-size: 11px;
    font-weight: 650;
    line-height: 1.4;
    color: #2456a3;
    background: #e7eef8;
    border-radius: 999px;
    padding: 1px 7px;
    font-variant-numeric: tabular-nums;
  }
  canvas { width: 100%; height: 180px; display: block; }
  section.panel {
    margin-top: 14px;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 12px;
  }
  .split { display: grid; grid-template-columns: 1.3fr 1fr; gap: 14px; align-items: start; }
  .nav { display: flex; gap: 8px; align-items: center; margin-bottom: 10px; }
  .nav select { flex: 1; min-width: 0; }
  .prefix {
    display: flex;
    align-items: center;
    gap: 12px;
    margin: 0 0 12px;
  }
  .prefix span {
    flex: none;
    font-variant-numeric: tabular-nums;
    font-weight: 650;
    min-width: 5.5em;
  }
  .prefix input[type="range"] { flex: 1; accent-color: var(--green); }
  button {
    font: inherit;
    border: 1px solid var(--line);
    background: #fff;
    border-radius: 999px;
    padding: 4px 10px;
    cursor: pointer;
    color: var(--ink);
  }
  button:disabled { opacity: 0.35; cursor: default; }
  img.sheet { width: 100%; height: auto; background: white; border: 1px solid var(--line); border-radius: 8px; }
  img.sample {
    display: block;
    max-width: 100%;
    max-height: 160px;
    width: auto;
    height: auto;
    margin: 4px 0 14px;
    background: white;
    border: 1px solid var(--line);
    border-radius: 8px;
  }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th, td { text-align: left; padding: 5px 6px; border-bottom: 1px solid var(--line); vertical-align: top; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; }
  th.num, td.num { white-space: nowrap; }
  tr.click { cursor: pointer; }
  tr.detail td { background: #fbf8f3; font-size: 13px; }
  .hyp { color: var(--muted); }
  @media (max-width: 800px) {
    .charts, .split { grid-template-columns: 1fr; }
    header { flex-direction: column; align-items: flex-start; }
  }
</style>
</head>
<body>
<header>
  <div>
    <h1>Handwriting RL</h1>
    <p id="session" class="sub"></p>
  </div>
  <div class="controls">
    <a href="/vcer">vCER rules</a>
    <a href="/blind">Blind test</a>
    <a href="/rlhf">RLHF</a>
    <span id="status" class="pill">Waiting</span>
    <label>Run <select id="run"></select></label>
  </div>
</header>
<main>
  <section class="panel" id="lines">
    <h2>Runs</h2>
    <p class="quiet">Each directory is one line. A label names it. The note is what changed at that start.</p>
    <div id="line-list"></div>
  </section>
  <p id="error" class="error"></p>
  <p id="note" class="note" hidden></p>
  <div class="views" role="group" aria-label="Which lines Reward and CER show">
    <span>Reward and CER</span>
    <button type="button" data-view="novel">Novel</button>
    <button type="button" data-view="words">Words</button>
    <button type="button" data-view="play">R&amp;J</button>
    <button type="button" data-view="both" class="on">All</button>
  </div>
  <section class="charts">
    <figure>
      <figcaption>Reward <span id="eta-reward" class="until"></span><span id="badge-reward" class="badge"></span></figcaption>
      <canvas id="chart-reward"></canvas>
    </figure>
    <figure>
      <figcaption>CER <span id="eta-cer" class="until"></span><span id="badge-cer" class="badge"></span></figcaption>
      <canvas id="chart-cer"></canvas>
    </figure>
    <figure>
      <figcaption>KL <span id="badge-kl" class="badge"></span></figcaption>
      <canvas id="chart-kl"></canvas>
    </figure>
    <figure>
      <figcaption>Steps <span id="badge-steps" class="badge"></span></figcaption>
      <canvas id="chart-steps"></canvas>
    </figure>
  </section>
  <section class="panel">
    <h2>Samples</h2>
    <div class="nav">
      <button type="button" id="gen-older">Older</button>
      <select id="gen-pick"></select>
      <button type="button" id="gen-newer">Newer</button>
    </div>
    <label class="prefix" id="prefix-nav" hidden>
      <span id="prefix-count">1 word</span>
      <input id="prefix-range" type="range" min="1" max="1" value="1" aria-label="Prefix length in words">
    </label>
    <img id="gen-sheet" class="sheet" alt="Training samples for the selected update" hidden>
    <div id="gen-lines"></div>
    <p id="gen-missing" class="quiet">No samples yet.</p>
  </section>
  <section class="panel">
    <h2>Review</h2>
    <div class="nav">
      <button type="button" id="review-older">Older</button>
      <select id="review-pick"></select>
      <button type="button" id="review-newer">Newer</button>
    </div>
    <div class="split">
      <div>
        <img id="sheet" class="sheet" alt="Review sheet for the selected checkpoint" hidden>
        <p id="sheet-missing" class="quiet" hidden></p>
      </div>
      <div>
        <table>
          <thead>
            <tr>
              <th class="num">Temp</th><th class="num">CER</th><th class="num">vCER</th>
              <th class="num">Reward</th><th class="num">Tilt</th><th class="num">Spacing</th>
              <th>Read</th>
            </tr>
          </thead>
          <tbody id="review-body"></tbody>
        </table>
      </div>
    </div>
  </section>
  <section class="panel">
    <h2>Updates</h2>
    <table>
      <thead>
        <tr>
          <th>Update</th><th>Reward</th><th>CER</th><th>KL</th><th>Steps</th>
        </tr>
      </thead>
      <tbody id="update-body"></tbody>
    </table>
  </section>
</main>
<script>
const state = {
  events: [],
  offset: 0,
  run: null,
  series: null,
  catalog: [],
  lineKey: "",
  linePending: false,
  block: null,
  expanded: null,
  gen: null,
  words: null,
  view: "both",
  token: "",
};

function esc(value) {
  return String(value ?? "").replace(/[&<>"']/g, (ch) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[ch]));
}

function num(value, digits) {
  if (value === null || value === undefined || Number.isNaN(Number(value))) return "—";
  return Number(value).toFixed(digits);
}

function runs() {
  const ids = [];
  const groups = new Map();
  for (const event of state.events) {
    const id = event.run || "run";
    if (!groups.has(id)) {
      groups.set(id, []);
      ids.push(id);
    }
    groups.get(id).push(event);
  }
  return { ids, groups };
}

function currentRows() {
  const { ids, groups } = runs();
  const id = state.run && ids.includes(state.run) ? state.run : ids[ids.length - 1];
  state.run = id || null;
  return { id, ids, rows: id ? groups.get(id) : [] };
}

function statusOf(rows) {
  if (!rows.length) return ["Waiting", ""];
  const last = rows[rows.length - 1];
  if (last.type === "stop") return ["Stopped", ""];
  if (typeof last.ts === "number" && Date.now() / 1000 - last.ts < 180) return ["Live", "live"];
  return ["Idle", "idle"];
}

function paintStatus(rows) {
  const [label, kind] = statusOf(rows);
  const pill = document.getElementById("status");
  pill.textContent = label;
  pill.className = "pill" + (kind ? " " + kind : "");
}

function points(rows, yKey) {
  return rows.filter((row) => row.type === "update" && row[yKey] != null)
    .map((row) => ({ x: row.update, y: row[yKey], t: row.ts }));
}

function band(rows, lowKey, highKey) {
  return rows.filter((row) => row.type === "update" && row[lowKey] != null && row[highKey] != null)
    .map((row) => ({ x: row.update, y0: row[lowKey], y1: row[highKey] }));
}

function dots(rows, yKey) {
  return rows.filter((row) => row.type === "review" && row[yKey] != null && row.update != null)
    .map((row) => ({ x: row.update, y: row[yKey] }));
}

function axisDigits(span) {
  if (!(span > 0)) return 0;
  const rough = Math.ceil(-Math.log10(span / 4));
  if (!Number.isFinite(rough)) return 0;
  return Math.min(4, Math.max(0, rough));
}

function fitLine(points) {
  const n = points.length;
  if (n < 2) return null;
  let sx = 0;
  let sy = 0;
  let sxx = 0;
  let sxy = 0;
  let xa = points[0].x;
  let xb = points[0].x;
  for (const point of points) {
    sx += point.x;
    sy += point.y;
    sxx += point.x * point.x;
    sxy += point.x * point.y;
    if (point.x < xa) xa = point.x;
    if (point.x > xb) xb = point.x;
  }
  const den = n * sxx - sx * sx;
  if (den === 0) return null;
  const slope = (n * sxy - sx * sy) / den;
  const intercept = (sy - slope * sx) / n;
  return { slope, intercept, xa, xb };
}

function trendText(slope) {
  const per = slope * 100;
  const abs = Math.abs(per);
  const digits = abs >= 100 ? 0 : abs >= 10 ? 1 : abs >= 1 ? 2 : abs >= 0.01 ? 3 : 4;
  return (per > 0 ? "+" : "") + per.toFixed(digits);
}

function formatClock(seconds) {
  const total = Math.max(0, Math.floor(seconds));
  const hours = Math.floor(total / 3600);
  const minutes = Math.floor((total % 3600) / 60);
  const secs = total % 60;
  return hours + "h " + minutes + "m " + secs + "s";
}

function etaState(points, fit, target) {
  if (!fit || !points.length) return null;
  let first = null;
  let last = null;
  for (const point of points) {
    if (point.t == null) continue;
    if (!first || point.x < first.x) first = point;
    if (!last || point.x > last.x) last = point;
  }
  if (!first || !last || last.x === first.x || last.t <= first.t) return null;
  const yNow = fit.intercept + fit.slope * fit.xb;
  const gap = target - yNow;
  if (Math.abs(gap) < 1e-4) return { kind: "text", label: "at perfection" };
  if (gap * fit.slope <= 0) return { kind: "text", label: "moving away" };
  const seconds = (gap / fit.slope) * (last.t - first.t) / (last.x - first.x);
  if (!Number.isFinite(seconds) || seconds < 0) return null;
  const sig = [fit.slope, fit.intercept, fit.xb, first.t, last.t, target].join("|");
  return { kind: "time", seconds, sig };
}

const clocks = {};

function rememberClock(id, state) {
  if (!state) {
    clocks[id] = null;
    return;
  }
  if (state.kind !== "time") {
    clocks[id] = state;
    return;
  }
  const prev = clocks[id];
  if (prev && prev.kind === "time" && prev.sig === state.sig) return;
  clocks[id] = { kind: "time", seconds: state.seconds, at: Date.now(), sig: state.sig };
}

function paintClocks() {
  for (const [id, item] of Object.entries(clocks)) {
    const node = document.getElementById(id);
    if (!node) continue;
    if (!item) {
      node.textContent = "";
      continue;
    }
    if (item.kind !== "time") {
      node.textContent = item.label;
      continue;
    }
    const left = item.seconds - (Date.now() - item.at) / 1000;
    node.textContent = formatClock(left) + " until perfection";
  }
}

setInterval(paintClocks, 1000);

function drawChart(canvas, spec) {
  const width = canvas.clientWidth;
  const height = canvas.clientHeight;
  if (width < 10 || height < 10) return;
  const ratio = window.devicePixelRatio || 1;
  canvas.width = Math.round(width * ratio);
  canvas.height = Math.round(height * ratio);
  const ctx = canvas.getContext("2d");
  ctx.setTransform(ratio, 0, 0, ratio, 0, 0);
  ctx.clearRect(0, 0, width, height);
  const line = [];
  for (const series of spec.series) line.push(...series.points);
  if (spec.dots) line.push(...spec.dots);
  const fit = fitLine((spec.series[0] && spec.series[0].points) || []);
  if (fit) {
    line.push(
      { x: fit.xa, y: fit.intercept + fit.slope * fit.xa },
      { x: fit.xb, y: fit.intercept + fit.slope * fit.xb },
    );
  }
  const xPoints = line.slice();
  if (spec.band) {
    for (const point of spec.band) {
      xPoints.push({ x: point.x, y: point.y0 }, { x: point.x, y: point.y1 });
    }
  }
  const pad = { l: 46, r: 12, t: 8, b: 24 };
  if (!xPoints.length) {
    ctx.fillStyle = "#5e584f";
    ctx.font = "13px ui-sans-serif, system-ui, sans-serif";
    ctx.fillText("No points yet", pad.l, height / 2);
    placeChartLabels(spec, null, []);
    return;
  }
  let x0 = Math.min(...xPoints.map((point) => point.x));
  let x1 = Math.max(...xPoints.map((point) => point.x));
  if (x0 === x1) { x0 -= 1; x1 += 1; }
  const ySource = line.length ? line : xPoints;
  const ys = ySource.map((point) => point.y);
  let y0 = Math.min(...ys);
  let y1 = Math.max(...ys);
  const span = y1 - y0 || Math.abs(y1) || 1;
  y0 -= span * 0.08;
  y1 += span * 0.08;
  if (spec.yMin != null) y0 = Math.max(y0, spec.yMin);
  if (spec.yMax != null) y1 = Math.min(y1, spec.yMax);
  if (!(y1 > y0)) {
    y0 = spec.yMin != null ? spec.yMin : y0;
    y1 = spec.yMax != null ? spec.yMax : y0 + 1;
  }
  const digits = axisDigits(y1 - y0);
  const plotW = width - pad.l - pad.r;
  const plotH = height - pad.t - pad.b;
  const sx = (x) => pad.l + (x - x0) / (x1 - x0) * plotW;
  const sy = (y) => pad.t + (y1 - y) / (y1 - y0) * plotH;
  ctx.strokeStyle = "#e3ddd2";
  ctx.fillStyle = "#5e584f";
  ctx.font = "11px ui-sans-serif, system-ui, sans-serif";
  ctx.lineWidth = 1;
  for (let i = 0; i < 4; i++) {
    const y = y0 + (y1 - y0) * i / 3;
    ctx.beginPath();
    ctx.moveTo(pad.l, sy(y));
    ctx.lineTo(width - pad.r, sy(y));
    ctx.stroke();
    ctx.fillText(y.toFixed(digits), 4, sy(y) + 3);
  }
  ctx.fillText(String(Math.round(x0)), pad.l, height - 6);
  ctx.fillText(String(Math.round(x1)), width - pad.r - 24, height - 6);
  ctx.save();
  ctx.beginPath();
  ctx.rect(pad.l, pad.t, plotW, plotH);
  ctx.clip();
  if (spec.band && spec.band.length) {
    ctx.beginPath();
    spec.band.forEach((point, i) => {
      const x = sx(point.x);
      if (i === 0) ctx.moveTo(x, sy(point.y1));
      else ctx.lineTo(x, sy(point.y1));
    });
    for (let i = spec.band.length - 1; i >= 0; i--) {
      ctx.lineTo(sx(spec.band[i].x), sy(spec.band[i].y0));
    }
    ctx.closePath();
    ctx.fillStyle = "rgba(31, 75, 58, 0.13)";
    ctx.fill();
  }
  for (const series of spec.series) {
    if (!series.points.length) continue;
    ctx.beginPath();
    series.points.forEach((point, i) => {
      const x = sx(point.x);
      const y = sy(point.y);
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    });
    ctx.strokeStyle = series.color;
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }
  if (fit) {
    ctx.beginPath();
    ctx.setLineDash([5, 4]);
    ctx.moveTo(sx(fit.xa), sy(fit.intercept + fit.slope * fit.xa));
    ctx.lineTo(sx(fit.xb), sy(fit.intercept + fit.slope * fit.xb));
    ctx.strokeStyle = "#2456a3";
    ctx.lineWidth = 1.5;
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if (spec.dots) {
    ctx.fillStyle = "#9a4318";
    for (const point of spec.dots) {
      ctx.beginPath();
      ctx.arc(sx(point.x), sy(point.y), 3.5, 0, Math.PI * 2);
      ctx.fill();
    }
  }
  ctx.restore();
  placeChartLabels(spec, fit, (spec.series[0] && spec.series[0].points) || []);
}

function placeChartLabels(spec, fit, points) {
  const badge = spec.badge ? document.getElementById(spec.badge) : null;
  if (badge) {
    if (fit) {
      badge.textContent = trendText(fit.slope);
      badge.title = "per 100 updates";
    } else {
      badge.textContent = "";
      badge.removeAttribute("title");
    }
  }
  if (!spec.eta) return;
  if (!fit || spec.perfect == null) {
    rememberClock(spec.eta, null);
  } else {
    rememberClock(spec.eta, etaState(points, fit, spec.perfect));
  }
  paintClocks();
}

function scrambledWord(word) {
  // A digit, or a capital past the first letter plus a lowercase letter.
  // All-caps English stays with the play.
  if (/[0-9]/.test(word)) return true;
  return /[a-z]/.test(word) && /[A-Z]/.test(word.slice(1));
}

function isNovelText(text) {
  const words = String(text || "").trim().split(/\s+/).filter(Boolean);
  if (!words.length || words.some((word) => !/^[A-Za-z0-9]+$/.test(word))) return false;
  if (words.length === 10 && words.every((word) => word.length <= 4)) return true;
  return words.every(scrambledWord);
}

const fullUpdates = new Map();
const fullPending = new Set();

function withDraws(row) {
  if (!row || !row.draws_omitted || row.draws) return row;
  const key = (row.run || "") + "/" + row.update;
  if (fullUpdates.has(key)) return fullUpdates.get(key);
  if (!fullPending.has(key)) {
    fullPending.add(key);
    const query = "update=" + encodeURIComponent(row.update)
      + "&run=" + encodeURIComponent(row.run || "")
      + (state.series ? "&series=" + encodeURIComponent(state.series) : "");
    fetch("/api/update?" + query, { cache: "no-store" })
      .then((response) => response.ok ? response.json() : null)
      .then((full) => {
        if (full) {
          fullUpdates.set(key, full);
          state.token = "";
          render();
        }
      })
      .catch(() => {})
      .finally(() => fullPending.delete(key));
  }
  return row;
}

function rowText(row) {
  if (row.example && row.example.text) return row.example.text;
  let best = "";
  for (const draw of row.draws || []) {
    const label = draw.text || "";
    if (label.length >= best.length) best = label;
  }
  return best;
}

function rowKind(row) {
  if (row.source === "novel" || row.source === "play" || row.source === "words") return row.source;
  return isNovelText(rowText(row)) ? "novel" : "play";
}

function viewRows(rows) {
  if (state.view === "both") return rows;
  return rows.filter((row) => {
    if (row.type === "update") return rowKind(row) === state.view;
    if (row.type === "review") return state.view === "play";
    return true;
  });
}

function drawCharts(rows) {
  const scored = viewRows(rows);
  drawChart(document.getElementById("chart-reward"), {
    series: [{ color: "#1f4b3a", points: points(scored, "reward_mean") }],
    band: band(scored, "reward_min", "reward_max"),
    dots: dots(scored, "reward_mean"),
    yMax: 1,
    perfect: 1,
    eta: "eta-reward",
    badge: "badge-reward",
  });
  drawChart(document.getElementById("chart-cer"), {
    series: [{ color: "#1f4b3a", points: points(scored, "cer_mean") }],
    band: band(scored, "cer_min", "cer_max"),
    dots: dots(scored, "cer_mean"),
    yMin: 0,
    perfect: 0,
    eta: "eta-cer",
    badge: "badge-cer",
  });
  drawChart(document.getElementById("chart-kl"), {
    series: [{ color: "#1f4b3a", points: points(rows, "kl") }],
    badge: "badge-kl",
  });
  drawChart(document.getElementById("chart-steps"), {
    series: [{ color: "#1f4b3a", points: points(rows, "steps_mean") }],
    badge: "badge-steps",
  });
}

function sessionLine(session) {
  const bits = [];
  if (session.reward) bits.push(session.reward);
  if (session.straightness) bits.push("straight " + session.straightness);
  if (session.spacing) bits.push("spacing " + session.spacing);
  if (session.tree && session.beam) {
    const parts = ["play " + session.beam + " tree"];
    if (session.words) {
      parts.push(session.easy_leaves ? "words " + session.easy_leaves : "words 4–8");
    }
    if (session.novel_leaves) parts.push("novel " + session.novel_leaves);
    bits.push(parts.join("  "));
  }
  else if (session.select_min != null && session.select_max != null && session.beam) {
    bits.push("beam " + session.beam + "  τ " + session.select_min + "–" + session.select_max);
  } else if (session.factors && session.beam) bits.push("beam " + session.beam);
  else if (session.beam) bits.push("beam " + session.beam + " × " + (session.keep || "?"));
  if (session.novel) bits.push("novel " + session.novel);
  if (session.words) bits.push("words " + session.words);
  if (!session.novel && !session.words) {
    if (session.batch) bits.push(session.batch + " × " + (session.k || "?"));
    else if (session.k) bits.push("k=" + session.k);
  }
  if (session.temperature_min != null && session.temperature_max != null) {
    const shape = session.temperature_distribution === "normal" ? "normal " : "";
    bits.push(shape + session.temperature_min + "–" + session.temperature_max);
  } else if (session.temperature != null) bits.push("temp " + session.temperature);
  return bits.join("  ·  ");
}

function prefixGroups(draws) {
  const order = [];
  const groups = new Map();
  for (const draw of draws || []) {
    const label = draw.text || "";
    if (!groups.has(label)) {
      groups.set(label, []);
      order.push(label);
    }
    groups.get(label).push(draw);
  }
  return order.map((label, index) => ({
    index,
    label,
    words: label.split(/\s+/).filter(Boolean).length || index + 1,
    draws: groups.get(label).slice().sort((a, b) => {
      const left = a.reward == null ? -Infinity : Number(a.reward);
      const right = b.reward == null ? -Infinity : Number(b.reward);
      return right - left;
    }),
  }));
}

function prefixAt(groups, words) {
  if (!groups.length) return null;
  const picked = words == null ? groups.length : words;
  const index = Math.min(groups.length, Math.max(1, picked)) - 1;
  return groups[index];
}

function paintPrefixSlider(groups) {
  const nav = document.getElementById("prefix-nav");
  const input = document.getElementById("prefix-range");
  const count = document.getElementById("prefix-count");
  if (groups.length < 2) {
    nav.hidden = true;
    return prefixAt(groups, state.words);
  }
  nav.hidden = false;
  const max = groups.length;
  let words = state.words == null ? max : Math.min(max, Math.max(1, state.words));
  if (document.activeElement !== input) {
    input.min = "1";
    input.max = String(max);
    input.value = String(words);
  } else {
    words = Math.min(max, Math.max(1, Number(input.value) || max));
    state.words = words;
  }
  count.textContent = words === 1 ? "1 word" : words + " words";
  return groups[words - 1];
}

function byLabelDescending(draws) {
  const order = [];
  const groups = new Map();
  for (const draw of draws || []) {
    const label = draw.text || "";
    if (!groups.has(label)) {
      groups.set(label, []);
      order.push(label);
    }
    groups.get(label).push(draw);
  }
  return order.map((label, index) => ({
    index,
    label,
    draws: groups.get(label).slice().sort((a, b) => {
      const left = a.reward == null ? -Infinity : Number(a.reward);
      const right = b.reward == null ? -Infinity : Number(b.reward);
      return right - left;
    }),
  }));
}

function samplePrompt(label) {
  return `<p class="sample-prompt"><span>${esc(label)}</span><span class="len">${label.length}</span></p>`;
}

function sheetUrl(name) {
  if (!name) return "";
  const series = state.series ? encodeURIComponent(state.series) + "/" : "";
  return "/sheets/" + series + encodeURIComponent(name);
}

function sampleImage(name) {
  if (!name) return "";
  return `<img class="sample" alt="Handwriting for this sample" src="${sheetUrl(name)}">`;
}

function samplePicture(draw, placeholders) {
  const saved = sampleImage(draw.image);
  if (saved) return saved;
  if (placeholders) return '<div class="sample-slot"></div>';
  return "";
}

function sampleTables(draws, placeholders) {
  const groups = byLabelDescending(draws);
  if (!groups.length) return "";
  return groups.map((group) => {
    const rows = group.draws.map((draw) => {
      const picture = samplePicture(draw, placeholders);
      const under = picture
        ? `<tr class="sample-pic"><td colspan="7">${picture}</td></tr>`
        : "";
      return `
      <tr>
        <td class="num">${num(draw.reward, 3)}</td>
        <td class="num">${num(draw.temperature, 2)}</td>
        <td class="num">${num(draw.cer, 3)}</td>
        <td class="num">${num(draw.straightness, 3)}</td>
        <td class="num">${num(draw.wcer, 3)}</td>
        <td class="num">${num(draw.spacing, 3)}</td>
        <td>${esc(draw.hyp || draw.skipped || "")}</td>
      </tr>${under}`;
    }).join("");
    return `${samplePrompt(group.label)}
      <table>
        <thead><tr>
          <th class="num">Reward</th><th class="num">Temp</th><th class="num">CER</th>
          <th class="num">Tilt</th><th class="num">vCER</th><th class="num">Spacing</th>
          <th>Read</th>
        </tr></thead>
        <tbody>${rows}</tbody>
      </table>`;
  }).join("");
}

const sheetCrops = new Map();

function loadSheetCrops(url) {
  if (sheetCrops.has(url)) return sheetCrops.get(url);
  const pending = new Promise((resolve) => {
    const img = new Image();
    img.onload = () => resolve(cropSheet(img));
    img.onerror = () => resolve([]);
    img.src = url;
  });
  sheetCrops.set(url, pending);
  return pending;
}

function cropSheet(img) {
  const w = img.naturalWidth;
  const h = img.naturalHeight;
  if (!w || !h) return [];
  const canvas = document.createElement("canvas");
  canvas.width = w;
  canvas.height = h;
  const ctx = canvas.getContext("2d", { willReadFrequently: true });
  ctx.drawImage(img, 0, 0);
  const data = ctx.getImageData(0, 0, w, h).data;
  const borders = [];
  for (let y = 0; y < h; y++) {
    let gray = 0;
    const row = y * w * 4;
    for (let x = 0; x < w; x++) {
      const i = row + x * 4;
      const dist = Math.abs(data[i] - 210) + Math.abs(data[i + 1] - 210) + Math.abs(data[i + 2] - 210);
      if (dist <= 18) gray += 1;
    }
    if (gray > 300) borders.push(y);
  }
  if (!borders.length || borders.length % 2 !== 0) return [];
  const urls = [];
  for (let i = 0; i < borders.length; i += 2) {
    const top = borders[i];
    const bottom = borders[i + 1];
    const span = bottom - top;
    if (span < 8 || span > 220) return [];
    if (i > 0 && top - borders[i - 1] > 80) return [];
    let left = w;
    let right = 0;
    const edge = top * w * 4;
    for (let x = 0; x < w; x++) {
      const j = edge + x * 4;
      const dist = Math.abs(data[j] - 210) + Math.abs(data[j + 1] - 210) + Math.abs(data[j + 2] - 210);
      if (dist <= 18) {
        if (x < left) left = x;
        if (x > right) right = x;
      }
    }
    if (right <= left) return [];
    const tile = document.createElement("canvas");
    tile.width = right - left + 1;
    tile.height = span + 1;
    tile.getContext("2d").drawImage(canvas, left, top, tile.width, tile.height, 0, 0, tile.width, tile.height);
    urls.push(tile.toDataURL("image/png"));
  }
  return urls;
}

function fillSampleSlots(root, urls) {
  if (!root) return false;
  const slots = root.querySelectorAll(".sample-slot");
  if (!slots.length || slots.length !== urls.length) return false;
  slots.forEach((slot, index) => {
    slot.innerHTML = `<img class="sample" alt="Handwriting for this sample" src="${urls[index]}">`;
  });
  return true;
}

function attachSheetCrops(url, root) {
  if (!url || !root) return;
  root.dataset.sheet = url;
  loadSheetCrops(url).then((urls) => {
    if (!root.isConnected || root.dataset.sheet !== url) return;
    if (fillSampleSlots(root, urls)) return;
    if (root.id !== "gen-lines") return;
    const genImg = document.getElementById("gen-sheet");
    genImg.src = url;
    genImg.dataset.src = url;
    genImg.hidden = false;
    root.querySelectorAll("tr.sample-pic").forEach((row) => row.remove());
  });
}

function reviewsOf(rows) {
  return rows.filter((row) => row.type === "review");
}

function selectedReview(rows) {
  const reviews = reviewsOf(rows);
  if (!reviews.length) return null;
  if (state.block != null) {
    const found = reviews.find((row) => row.block === state.block && row.type === "review")
      || reviews.find((row) => row.block === state.block);
    if (found) return found;
  }
  return reviews[reviews.length - 1];
}

function render() {
  const { id, ids, rows } = currentRows();
  paintStatus(rows);
  const token = [
    state.series, state.events.length, state.offset, id, state.block, state.expanded, state.gen,
  ].join(":");
  if (token === state.token) return;
  state.token = token;

  const select = document.getElementById("run");
  const catalogRun = (state.catalog || []).find((item) => item.id === state.series);
  select.innerHTML = ids.map((runId) => {
    const sessionNote = catalogRun && (catalogRun.sessions || []).find((item) => item.run === runId);
    const label = sessionNote && sessionNote.label;
    return `<option value="${esc(runId)}">${esc(label ? runId + " · " + label : runId)}</option>`;
  }).join("");
  if (id) select.value = id;

  const session = rows.find((row) => row.type === "session") || {};
  const runNote = catalogRun && (catalogRun.sessions || []).find((item) => item.run === id);
  const title = (runNote && runNote.label) || (catalogRun && catalogRun.label) || "";
  const recorded = sessionLine(session);
  document.getElementById("session").textContent = [title, recorded].filter(Boolean).join("  ·  ")
    || "No session recorded yet.";
  const note = document.getElementById("note");
  const written = (runNote && runNote.comment) || (catalogRun && catalogRun.comment) || session.note;
  if (written) {
    note.hidden = false;
    note.textContent = written;
  } else {
    note.hidden = true;
  }

  const samples = rows.filter((row) => row.type === "update" && row.sheet);
  const chosen = withDraws(samples.find((row) => String(row.update) === String(state.gen)) || samples[samples.length - 1] || null);
  const genPick = document.getElementById("gen-pick");
  genPick.innerHTML = samples.slice().reverse().map((row) => {
    const width = row.beam || session.beam;
    let mode = row.method === "sft" ? "sft " : "";
    if (row.tree) {
      mode += `${String(row.tree).replace(/x/g, "×")} · `;
    } else if (row.select_tau != null) {
      const tau = Number(row.select_tau);
      mode = `τ ${Number.isFinite(tau) ? tau.toFixed(2) : row.select_tau} · `;
    } else if (row.factor && width) {
      mode = `${width} / ${row.factor} x ${row.factor} · `;
    }
    return `<option value="${row.update}">${row.update} · ${mode}reward ${num(row.reward_mean, 3)} · CER ${num(row.cer_mean, 3)}</option>`;
  }).join("");
  if (chosen) genPick.value = String(chosen.update);
  const genIndex = chosen ? samples.findIndex((row) => row.update === chosen.update) : -1;
  document.getElementById("gen-older").disabled = genIndex <= 0;
  document.getElementById("gen-newer").disabled = genIndex < 0 || genIndex >= samples.length - 1;
  const genImg = document.getElementById("gen-sheet");
  const genMissing = document.getElementById("gen-missing");
  const genLines = document.getElementById("gen-lines");
  const prefix = paintPrefixSlider(prefixGroups(chosen && chosen.draws));
  const prefixDraws = prefix ? prefix.draws : [];
  const piecewise = prefixDraws.some((draw) => draw.image);
  const stacked = Boolean(chosen && chosen.sheet && !piecewise && prefixDraws.length);
  genMissing.hidden = Boolean(chosen);
  genLines.innerHTML = sampleTables(prefixDraws, stacked);
  if (stacked) {
    genImg.hidden = true;
    genImg.removeAttribute("src");
    delete genImg.dataset.src;
    attachSheetCrops(sheetUrl(chosen.sheet), genLines);
  } else if (chosen && chosen.sheet && !piecewise) {
    const next = sheetUrl(chosen.sheet);
    genImg.dataset.src = next;
    genImg.src = next;
    genImg.hidden = false;
  } else {
    genImg.hidden = true;
    genImg.removeAttribute("src");
    delete genImg.dataset.src;
  }

  const updates = rows.filter((row) => row.type === "update");
  const reviews = rows.filter((row) => row.type === "review");

  const review = selectedReview(rows);
  const reviewPick = document.getElementById("review-pick");
  reviewPick.innerHTML = reviews.slice().reverse().map((row) => {
    const mark = row.best ? " · best" : "";
    return `<option value="${row.block}">ckpt ${String(row.block).padStart(4, "0")} · reward ${num(row.reward_mean, 3)} · CER ${num(row.cer_mean, 3)}${mark}</option>`;
  }).join("");
  if (review) reviewPick.value = String(review.block);
  const reviewIndex = review ? reviews.findIndex((row) => row.block === review.block && row.update === review.update) : -1;
  document.getElementById("review-older").disabled = reviewIndex <= 0;
  document.getElementById("review-newer").disabled = reviewIndex < 0 || reviewIndex >= reviews.length - 1;

  const img = document.getElementById("sheet");
  const missing = document.getElementById("sheet-missing");
  if (review && review.sheet) {
    const next = sheetUrl(review.sheet);
    if (img.dataset.src !== next) {
      img.dataset.src = next;
      img.src = next;
    }
    img.hidden = false;
    missing.hidden = true;
  } else {
    img.hidden = true;
    img.removeAttribute("src");
    delete img.dataset.src;
    missing.hidden = false;
    missing.textContent = reviews.length ? "No sheet for this review." : "No reviews yet.";
  }
  const body = document.getElementById("review-body");
  const draws = review && review.draws ? review.draws : [];
  body.innerHTML = draws.map((draw) => `
    <tr>
      <td class="num">${num(draw.temperature, 2)}</td>
      <td class="num">${num(draw.cer, 3)}</td>
      <td class="num">${num(draw.wcer, 3)}</td>
      <td class="num">${num(draw.reward, 3)}</td>
      <td class="num">${num(draw.straightness, 3)}</td>
      <td class="num">${num(draw.spacing, 3)}</td>
      <td>${esc(draw.hyp || "")}</td>
    </tr>`).join("") || `<tr><td colspan="7" class="quiet">No review draws.</td></tr>`;

  const shown = updates.slice(-40);
  document.getElementById("update-body").innerHTML = shown.map((row) => {
    const open = String(state.expanded) === String(row.update);
    const head = `
      <tr class="click" data-update="${row.update}">
        <td>${row.update}</td>
        <td>${num(row.reward_mean, 3)}</td>
        <td>${num(row.cer_mean, 3)}</td>
        <td>${num(row.kl, 3)}</td>
        <td>${num(row.steps_mean, 0)}</td>
      </tr>`;
    if (!open) return head;
    row = withDraws(row);
    const prefix = prefixAt(prefixGroups(row.draws), state.words);
    const shownDraws = prefix ? prefix.draws : [];
    const ownPictures = shownDraws.some((draw) => draw.image);
    const stacked = Boolean(row.sheet && !ownPictures && (row.draws || []).length);
    const detail = byLabelDescending(shownDraws).map((group) => {
      const lines = group.draws.map((draw) => `
        <div>reward ${num(draw.reward, 3)}
          · temp ${num(draw.temperature, 2)}
          · CER ${num(draw.cer, 3)}
          · ${esc(draw.hyp || draw.skipped || "")}
        </div>${samplePicture(draw, stacked)}`).join("");
      return `${samplePrompt(group.label)}${lines}`;
    }).join("");
    const detailBody = detail || "No per-draw records.";
    return head + `<tr class="detail"><td colspan="5"><div class="draw-detail" data-sheet="${stacked ? esc(row.sheet) : ""}">${detailBody}</div></td></tr>`;
  }).reverse().join("") || `<tr><td colspan="5" class="quiet">No updates yet.</td></tr>`;
  const openDetail = document.querySelector("#update-body .draw-detail");
  if (openDetail && openDetail.dataset.sheet) {
    attachSheetCrops(sheetUrl(openDetail.dataset.sheet), openDetail);
  }

  requestAnimationFrame(() => drawCharts(rows));
}

document.getElementById("run").addEventListener("change", (event) => {
  state.run = event.target.value;
  state.block = null;
  state.expanded = null;
  state.gen = null;
  state.token = "";
  render();
});

function stepSample(delta) {
  const { rows } = currentRows();
  const samples = rows.filter((row) => row.type === "update" && row.sheet);
  const index = Math.max(0, samples.findIndex((row) => String(row.update) === String(state.gen)));
  const current = state.gen == null ? samples.length - 1 : index;
  const next = samples[current + delta];
  if (!next) return;
  state.gen = String(next.update);
  state.token = "";
  render();
}

document.getElementById("gen-older").addEventListener("click", () => stepSample(-1));
document.getElementById("gen-newer").addEventListener("click", () => stepSample(1));
document.querySelectorAll(".views button").forEach((button) => {
  button.addEventListener("click", () => {
    state.view = button.dataset.view;
    document.querySelectorAll(".views button").forEach((item) => {
      item.classList.toggle("on", item === button);
    });
    const { rows } = currentRows();
    drawCharts(rows);
  });
});

document.getElementById("prefix-range").addEventListener("input", (event) => {
  state.words = Number(event.target.value);
  render();
});

document.getElementById("gen-pick").addEventListener("change", (event) => {
  state.gen = event.target.value;
  state.token = "";
  render();
});

function stepReview(delta) {
  const { rows } = currentRows();
  const reviews = rows.filter((row) => row.type === "review");
  const index = reviews.findIndex((row) => row.block === state.block);
  const current = state.block == null ? reviews.length - 1 : Math.max(0, index);
  const next = reviews[current + delta];
  if (!next) return;
  state.block = next.block;
  state.token = "";
  render();
}

document.getElementById("review-older").addEventListener("click", () => stepReview(-1));
document.getElementById("review-newer").addEventListener("click", () => stepReview(1));
document.getElementById("review-pick").addEventListener("change", (event) => {
  state.block = Number(event.target.value);
  state.token = "";
  render();
});

document.getElementById("update-body").addEventListener("click", (event) => {
  const row = event.target.closest("tr[data-update]");
  if (!row) return;
  const update = row.dataset.update;
  state.expanded = String(state.expanded) === update ? null : update;
  state.token = "";
  render();
});

window.addEventListener("resize", () => {
  const { rows } = currentRows();
  drawCharts(rows);
});

function when(ts) {
  if (typeof ts !== "number") return "";
  const date = new Date(ts * 1000);
  const pad = (value) => String(value).padStart(2, "0");
  return date.getFullYear() + "-" + pad(date.getMonth() + 1) + "-" + pad(date.getDate())
    + " " + pad(date.getHours()) + ":" + pad(date.getMinutes());
}

function catalogStructure(catalog) {
  return (catalog || []).map((series) => ({
    id: series.id,
    label: series.label,
    comment: series.comment,
    sessions: (series.sessions || []).map((session) => ({
      run: session.run,
      label: session.label,
      comment: session.comment,
      summary: session.summary,
      ts: session.ts,
    })),
  }));
}

function paintCounts() {
  for (const series of state.catalog || []) {
    const node = document.querySelector('[data-count="' + CSS.escape(series.id) + '"]');
    if (!node) continue;
    const live = series.live ? " · live" : "";
    node.textContent = series.updates + " updates" + live;
  }
  for (const series of state.catalog || []) {
    for (const session of series.sessions || []) {
      const node = document.querySelector(
        '[data-run-count="' + series.id + "|" + session.run + '"]');
      if (node) node.textContent = session.updates + " updates";
    }
  }
}

function noteForm(seriesId, runId, label, comment) {
  const run = runId ? ` data-run="${esc(runId)}"` : "";
  const labelName = runId ? "What changed" : "Line";
  const commentName = runId ? "Note" : "About this line";
  return `<form class="${runId ? "session-form" : "line-form"}" data-series="${esc(seriesId)}"${run}>
    <span class="field-label">${labelName}</span>
    <input name="label" maxlength="80" placeholder="${runId ? "Short name for this start" : "Short name for this line"}" value="${esc(label || "")}">
    <span class="field-label">${commentName}</span>
    <textarea name="comment" rows="3" maxlength="4000" placeholder="${runId ? "What changed at this start" : "What this line is for"}">${esc(comment || "")}</textarea>
    <button type="submit">Save</button>
  </form>`;
}

function paintLines() {
  const list = document.getElementById("line-list");
  const key = JSON.stringify(catalogStructure(state.catalog)) + "|" + state.series + "|" + state.run;
  if (key === state.lineKey) {
    paintCounts();
    return;
  }
  if (list.contains(document.activeElement)) {
    state.linePending = true;
    paintCounts();
    return;
  }
  state.linePending = false;
  state.lineKey = key;
  if (!state.catalog.length) {
    list.innerHTML = '<p class="quiet">No training logs under samples/ yet.</p>';
    return;
  }
  list.innerHTML = state.catalog.map((series) => {
    const open = series.id === state.series;
    const title = series.label || series.id;
    const sessions = (series.sessions || []).slice().reverse().map((session) => {
      const picked = open && session.run === state.run;
      const stamp = when(session.ts);
      const name = session.label || session.run;
      return `<div class="session${picked ? " on" : ""}">
        <button type="button" class="session-head" data-series="${esc(series.id)}" data-run="${esc(session.run)}">
          <span class="line-name">${esc(name)}</span>
          <span class="auto">${esc([stamp, session.summary].filter(Boolean).join(" · "))}</span>
          <span class="line-meta" data-run-count="${esc(series.id + "|" + session.run)}">${session.updates} updates</span>
        </button>
        ${open ? noteForm(series.id, session.run, session.label, session.comment) : ""}
      </div>`;
    }).join("");
    return `<article class="line${open ? " on" : ""}">
      <button type="button" class="line-head" data-series="${esc(series.id)}">
        <span class="line-name">${esc(title)}</span>
        <span class="auto">${series.label ? esc(series.id) : ""}</span>
        <span class="line-meta" data-count="${esc(series.id)}"></span>
      </button>
      ${open ? noteForm(series.id, "", series.label, series.comment) + sessions : ""}
    </article>`;
  }).join("");
  paintCounts();
}

function selectSeries(id, run) {
  if (state.series === id) {
    if (run != null && run !== state.run) {
      state.run = run;
      state.block = null;
      state.expanded = null;
      state.gen = null;
      state.token = "";
      state.lineKey = "";
      render();
      paintLines();
    }
    return;
  }
  state.series = id;
  state.events = [];
  state.offset = 0;
  state.run = run;
  state.block = null;
  state.expanded = null;
  state.gen = null;
  state.words = null;
  state.token = "";
  state.lineKey = "";
  paintLines();
  poll();
}

document.getElementById("line-list").addEventListener("click", (event) => {
  const sessionBtn = event.target.closest(".session-head");
  if (sessionBtn) {
    selectSeries(sessionBtn.dataset.series, sessionBtn.dataset.run);
    return;
  }
  const lineBtn = event.target.closest(".line-head");
  if (lineBtn) selectSeries(lineBtn.dataset.series, null);
});

document.getElementById("line-list").addEventListener("focusout", () => {
  if (!state.linePending) return;
  if (document.getElementById("line-list").contains(document.activeElement)) return;
  paintLines();
});

document.getElementById("line-list").addEventListener("submit", async (event) => {
  const form = event.target.closest("form");
  if (!form) return;
  event.preventDefault();
  const button = form.querySelector("button");
  button.disabled = true;
  try {
    const response = await fetch("/api/notes", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        series: form.dataset.series,
        run: form.dataset.run || "",
        label: form.querySelector("[name=label]").value,
        comment: form.querySelector("[name=comment]").value,
      }),
    });
    if (!response.ok) throw new Error(await response.text());
    state.lineKey = "";
    await loadCatalog();
  } catch (err) {
    document.getElementById("error").textContent = "The note was not saved.";
  } finally {
    button.disabled = false;
  }
});

let pollTicket = 0;

async function loadCatalog() {
  const response = await fetch("/api/series", { cache: "no-store" });
  if (!response.ok) throw new Error(String(response.status));
  const body = await response.json();
  state.catalog = body.series || [];
  if (!state.series && state.catalog.length) state.series = state.catalog[0].id;
  const structure = JSON.stringify(catalogStructure(state.catalog));
  paintLines();
  if (structure !== state.catalogStructure) {
    state.catalogStructure = structure;
    state.token = "";
    render();
  }
}

async function poll() {
  const requested = state.series;
  const ticket = ++pollTicket;
  try {
    const query = "offset=" + state.offset
      + (requested ? "&series=" + encodeURIComponent(requested) : "");
    const response = await fetch("/api/events?" + query, { cache: "no-store" });
    if (!response.ok) throw new Error(String(response.status));
    const body = await response.json();
    if (ticket !== pollTicket) return;
    if (requested && body.series && body.series !== requested) return;
    if (!state.series && body.series) state.series = body.series;
    if (body.reset) {
      state.events = [];
      state.token = "";
    }
    if (body.events && body.events.length) state.events.push(...body.events);
    state.offset = body.offset;
    document.getElementById("error").textContent = "";
    const { rows } = currentRows();
    paintStatus(rows);
    render();
    paintLines();
  } catch (err) {
    document.getElementById("error").textContent = "The dashboard cannot reach its server.";
  }
}

loadCatalog().then(poll).catch(() => {
  document.getElementById("error").textContent = "The dashboard cannot reach its server.";
});
setInterval(poll, 1000);
setInterval(() => {
  loadCatalog().catch(() => {});
}, 5000);
</script>
</body>
</html>
